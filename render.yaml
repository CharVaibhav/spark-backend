services:
  # All-in-One Spark Service (API + AI Worker)
  - type: web
    name: spark-all-in-one
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    # Using starter/standard is recommended due to the Chromium/AI load
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - fromGroup: spark-secrets
      - fromGroup: spark-db-redis

envVarGroups:
  - name: spark-secrets
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - name: spark-db-redis
    envVars:
      - key: REDIS_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
